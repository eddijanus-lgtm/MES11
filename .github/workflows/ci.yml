name: MES CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend-Tests und Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: npm
      - run: npm ci
      - run: npm test -- --ci --runInBand
      - run: npm run test:e2e -- --ci --runInBand
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: backend
          path: dist/
          if-no-files-found: error
          retention-days: 1

  frontend:
    name: Frontend-Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: frontend
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 1

  release:
    name: Release-Paket
    if: github.event_name == 'push'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v5
        with:
          name: backend
          path: dist
      - uses: actions/download-artifact@v5
        with:
          name: frontend
          path: frontend/dist
      - name: Release-Archiv erstellen
        run: |
          test -f dist/main.js
          test -f frontend/dist/index.html
          tar -czf "mes-${GITHUB_SHA}.tar.gz" dist frontend/dist package.json package-lock.json \
            tools/create-admin.js tools/phase3-apply.js docker-compose.yml deploy/mosquitto.conf
      - uses: actions/upload-artifact@v4
        with:
          name: mes-${{ github.sha }}
          path: mes-${{ github.sha }}.tar.gz
          if-no-files-found: error
          retention-days: 30
